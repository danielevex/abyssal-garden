<div id="ui"><small>Cozy Paw Worlds · P09 / Material Study</small><h1>Pietra e Luce</h1><p>Un solo scorcio, una nuova grammatica visiva. Roccia volumetrica, intonaci consumati, castagni, luce radente e foschia. Trascina per cambiare prospettiva.</p></div>
<div id="tools"><button id="low">Mobile</button><button id="high">Alta</button></div><div id="status">Preparazione renderer WebGPU…</div><div id="failure"></div>
<script type="module">
const shader="\nstruct Frame { resolution:vec2f, time:f32, quality:f32, eye:vec4f, lookAt:vec4f, sun:vec4f };\n@group(0) @binding(0) var<uniform> U:Frame;\nfn hash(p:vec3f)->f32{return fract(sin(dot(p,vec3f(127.1,311.7,74.7)))*43758.5453);}\nfn noise(p:vec3f)->f32{\n let i=floor(p);let f=fract(p);let u=f*f*(3.-2.*f);\n let a=mix(hash(i),hash(i+vec3f(1,0,0)),u.x);\n let b=mix(hash(i+vec3f(0,1,0)),hash(i+vec3f(1,1,0)),u.x);\n let c=mix(hash(i+vec3f(0,0,1)),hash(i+vec3f(1,0,1)),u.x);\n let d=mix(hash(i+vec3f(0,1,1)),hash(i+vec3f(1,1,1)),u.x);\n return mix(mix(a,b,u.y),mix(c,d,u.y),u.z);\n}\nfn fractal(p:vec3f)->f32{\n return noise(p)*.55+noise(p*2.11+vec3f(8.3,1.8,3.7))*.29+noise(p*4.31+vec3f(14.1))*.16;\n}\nfn bx(p:vec3f,b:vec3f,r:f32)->f32{\n let d=abs(p)-b;return length(max(d,vec3f(0.)))+min(max(d.x,max(d.y,d.z)),0.)-r;\n}\nfn terrain(xz:vec2f)->f32{\n let path=exp(-pow(xz.x/2.0,2.))*exp(-pow((xz.y+2.)/30.,2.));\n let und=.65*noise(vec3f(xz.x*.13,0.,xz.y*.13))+.32*noise(vec3f(xz.x*.4,7.,xz.y*.4));\n return -.28+und*(1.-path*.78)+.025*sin(xz.y*.8);\n}\nfn tree(p:vec3f,base:vec3f,h:f32)->vec2f{\n let q=p-base;var trunk=length(q.xz)-.18;\n trunk=max(trunk,abs(q.y-h*.49)-h*.49);\n let crown=(length((q-vec3f(0.,h,0.))/vec3f(1.45,h*.51,1.4))-1.)*1.1;\n let crown2=(length((q-vec3f(-.72,h*.82,.26))/vec3f(1.04,.85,1.01))-1.)*.83;\n let leaf=min(crown,crown2);\n let rim=(noise(q*1.9)-.5)*.30;\n return select(vec2f(trunk,3.),vec2f(leaf+rim,4.),leaf+rim<trunk);\n}\nfn map(p:vec3f)->vec2f{\n var d=vec2f(p.y-terrain(p.xz),1.);\n // A broken, half-buried Tuscan-Lunigiana arch: real negative opening.\n let a=p-vec3f(0.,1.25,-3.9);\n let left=bx(a-vec3f(-1.60,0.,0.),vec3f(.55,1.65,.78),.12);\n let right=bx(a-vec3f(1.60,0.,0.),vec3f(.55,1.65,.78),.12);\n let lintel=bx(a-vec3f(0.,1.63,0.),vec3f(2.04,.32,.78),.12);\n let arch=min(min(left,right),lintel);\n // The keystone arch has cut voussoirs and sculpted roughness.\n d=select(d,vec2f(arch,2.),arch<d.x);\n // Tower beyond the arch, asymmetric silhouette.\n let t=p-vec3f(-5.4,3.5,-12.);\n var tower=bx(t,vec3f(1.65,3.9,1.55),.12);\n let top=bx(t-vec3f(0.,4.0,0.),vec3f(1.91,.28,1.84),.08);\n tower=min(tower,top);\n let slit=bx(t-vec3f(1.57,1.0,.0),vec3f(.25,.75,.20),.03);\n tower=max(tower,-slit);\n d=select(d,vec2f(tower,2.),tower<d.x);\n // Old farmhouse: stone walls, roof overhang, terracotta.\n let h=p-vec3f(5.15,1.45,-10.2);\n var walls=bx(h,vec3f(2.15,1.85,2.05),.15);\n let door=bx(h-vec3f(-.45,-.56,2.0),vec3f(.53,1.16,.29),.09);\n walls=max(walls,-door);\n d=select(d,vec2f(walls,2.),walls<d.x);\n var roof=max(abs(h.x)*.66+h.y-3.12,abs(h.z)-2.5);\n roof=max(roof,2.35-h.y);\n d=select(d,vec2f(roof,5.),roof<d.x);\n // Castagni whose crowns are sculpted with coherent volume noise.\n let tr0=tree(p,vec3f(-8.,terrain(vec2f(-8.,-5.)),-5.),7.7);\n let tr1=tree(p,vec3f(8.,terrain(vec2f(8.,-4.)),-4.),8.1);\n let tr2=tree(p,vec3f(-12.,terrain(vec2f(-12.,-16.)),-16.),10.1);\n let tr3=tree(p,vec3f(13.,terrain(vec2f(13.,-17.)),-17.),9.1);\n for(var k=0;k<4;k++){\n  var v=tr0;\n  if(k==1){v=tr1;}if(k==2){v=tr2;}if(k==3){v=tr3;}\n  if(v.x<d.x){d=v;}\n }\n return d;\n}\nfn normal(p:vec3f)->vec3f{\n let e=.017;\n let dx=map(p+vec3f(e,0.,0.)).x-map(p-vec3f(e,0.,0.)).x;\n let dy=map(p+vec3f(0.,e,0.)).x-map(p-vec3f(0.,e,0.)).x;\n let dz=map(p+vec3f(0.,0.,e)).x-map(p-vec3f(0.,0.,e)).x;\n return normalize(vec3f(dx,dy,dz));\n}\nfn softShadow(p:vec3f,l:vec3f)->f32{\n var shade=1.;var t=.12;\n for(var i=0;i<10;i++){\n  let v=map(p+l*t).x;\n  shade=min(shade,12.*v/max(t,.02));\n  t+=clamp(v,.07,1.4);\n  if(t>24.){break;}\n }\n return clamp(shade,.18,1.);\n}\nfn sky(dir:vec3f)->vec3f{\n let h=clamp(dir.y*.5+.5,0.,1.);\n var c=mix(vec3f(.86,.69,.51),vec3f(.15,.31,.43),pow(h,.75));\n let suns=pow(max(dot(dir,normalize(U.sun.xyz)),0.),320.);\n let bloom=pow(max(dot(dir,normalize(U.sun.xyz)),0.),13.);\n c+=vec3f(1.35,.94,.54)*suns+vec3f(.67,.45,.23)*bloom*.25;\n // Distant aerial perspective and broad cloud banks.\n let cloud=fractal(vec3f(dir.x*6.,dir.y*8.+2.4,dir.z*6.+U.time*.002));\n c+=vec3f(.30,.22,.15)*smoothstep(.56,.81,cloud)*smoothstep(.26,.70,dir.y);\n return c;\n}\nfn stoneColor(p:vec3f,n:vec3f)->vec3f{\n // Tri-planar, layered low- and high-frequency mineral colour.\n let w=pow(abs(n),vec3f(5.));let sw=w.x+w.y+w.z;w/=max(sw,.001);\n let a=fractal(p.zyx*1.35)*w.x+fractal(p.xzy*1.35)*w.y+fractal(p.xyz*1.35)*w.z;\n let b=noise(p*11.4);\n let joint=abs(fract(p.y*1.65+noise(p*.17)*.12)-.5);\n let mortar=1.-smoothstep(.022,.068,joint);\n let base=mix(vec3f(.23,.245,.22),vec3f(.67,.62,.53),smoothstep(.18,.85,a));\n base*=.83+.27*b;\n base=mix(base,vec3f(.18,.185,.16),mortar*.39);\n let moss=smoothstep(.53,.77,fractal(p*.45+vec3f(7.)))*(1.-max(0.,n.y)*.4);\n return mix(base,base*vec3f(.46,.61,.37),moss*.4);\n}\nfn material(p:vec3f,n:vec3f,id:f32)->vec3f{\n if(id<1.5){\n  let path=exp(-pow(p.x/1.6,2.));\n  let dirt=mix(vec3f(.24,.29,.16),vec3f(.43,.38,.28),path);\n  let fleck=fractal(p*2.3);\n  return dirt*(.72+.6*fleck);\n }\n if(id<2.5){return stoneColor(p,n);}\n if(id<3.5){return mix(vec3f(.24,.12,.055),vec3f(.45,.27,.12),fractal(p*1.8));}\n if(id<4.5){\n  let leaf=fractal(p*1.5+vec3f(2.,0.,7.));\n  return mix(vec3f(.045,.115,.055),vec3f(.32,.43,.125),leaf);\n }\n return mix(vec3f(.28,.095,.055),vec3f(.58,.25,.12),fractal(p*3.));\n}\n@vertex fn vertex(@builtin(vertex_index) i:u32)->@builtin(position) vec4f{\n let x=f32(i32(i&1u)*4-1); let y=f32(i32(i>>1u)*4-1);\n return vec4f(x,y,0.,1.);\n}\n@fragment fn fragment(@builtin(position) f:vec4f)->@location(0) vec4f{\n let uv=(f.xy-.5*U.resolution)/U.resolution.y;\n let forward=normalize(U.lookAt.xyz-U.eye.xyz);\n let right=normalize(cross(forward,vec3f(0.,1.,0.)));\n let up=cross(right,forward);\n let ray=normalize(forward*1.65+uv.x*right*2.+uv.y*up*-2.);\n let sun=normalize(U.sun.xyz);\n var t=.025;var hit=vec2f(999.,0.);\n var pos=U.eye.xyz;\n for(var i=0;i<72;i++){\n  pos=U.eye.xyz+ray*t;\n  hit=map(pos);\n  if(hit.x<.018||t>110.){break;}\n  t+=max(.035,hit.x*.83);\n }\n var col=sky(ray);\n if(t<110.&&hit.x<.06){\n  let n=normal(pos);\n  let albedo=material(pos,n,hit.y);\n  // Subtle geometric ambient occlusion, sunlight, cool sky and bounce.\n  let ao=clamp(map(pos+n*.16).x/.16,.42,1.);\n  let shade=softShadow(pos+n*.06,sun);\n  let sunLight=max(dot(n,sun),0.)*shade;\n  let skyLight=clamp(n.y*.55+.45,0.,1.);\n  col=albedo*(vec3f(.21,.25,.29)*skyLight+vec3f(.19,.12,.07)+vec3f(1.65,1.27,.84)*sunLight)*ao;\n  let v=normalize(U.eye.xyz-pos);\n  let halfV=normalize(v+sun);\n  let spec=pow(max(dot(n,halfV),0.),28.)*sunLight*.06;\n  col+=vec3f(1.,.79,.55)*spec;\n  let distanceFog=1.-exp(-t*(.007+.004*exp(-max(pos.y,0.)*.15)));\n  col=mix(col,sky(ray)*.85+vec3f(.16,.14,.10),clamp(distanceFog,0.,.70));\n }\n // Filmic ACES, highlight shaping and vignette.\n col=max(col,vec3f(0.));\n col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);\n col=clamp(col,vec3f(0.),vec3f(1.));\n let xy=f.xy/U.resolution;\n col*=1.-.18*pow(length((xy-.5)*vec2f(1.1,1.)),1.6);\n col=pow(col,vec3f(1./2.2));\n let d=fract(sin(dot(f.xy,vec2f(12.9898,78.233)))*43758.5453)-.5;\n return vec4f(clamp(col+d/360.,vec3f(0.),vec3f(1.)),1.);\n}\n";
const status=document.getElementById('status');
const touch=matchMedia('(pointer:coarse)').matches;
let scale=touch?.34:.54,yaw=0,pitch=.10,drag=false,px=0,py=0;
document.getElementById('low').onclick=()=>{scale=.42;resize(true)};
document.getElementById('high').onclick=()=>{scale=touch?.46:.72;resize(true)};
async function main(){
 if(!navigator.gpu)throw Error('Questo studio richiede WebGPU (Chrome/Edge con accelerazione hardware).');
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter)throw Error('Adattatore WebGPU non trovato');
 const device=await adapter.requestDevice(),queue=device.queue;
 const canvas=document.createElement('canvas');document.body.prepend(canvas);
 const context=canvas.getContext('webgpu'),format=navigator.gpu.getPreferredCanvasFormat();
 const module=device.createShaderModule({code:shader});
 const info=await module.getCompilationInfo();
 const errors=info.messages.filter(x=>x.type==='error');
 if(errors.length)throw Error('WGSL: '+errors.map(x=>x.message+' riga '+x.lineNum).join('; ').slice(0,350));
 const pipeline=device.createRenderPipeline({layout:'auto',vertex:{module,entryPoint:'vertex'},fragment:{module,entryPoint:'fragment',targets:[{format}]},primitive:{topology:'triangle-list'}});
 const uniform=device.createBuffer({size:80,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
 const bg=device.createBindGroup({layout:pipeline.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:uniform}}]});
 const data=new Float32Array(20);
 let w=0,h=0,last=0,frames=0,start=performance.now();
 window.resize=(force=false)=>{const ww=Math.max(2,Math.floor(innerWidth*scale/2)*2),hh=Math.max(2,Math.floor(innerHeight*scale/2)*2);if(!force&&w===ww&&h===hh)return;w=ww;h=hh;canvas.width=w;canvas.height=h;context.configure({device,format,alphaMode:'opaque'});};
 canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId)});
 canvas.addEventListener('pointerup',()=>drag=false);
 canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=Math.max(-.8,Math.min(.8,yaw+(e.clientX-px)*.004));pitch=Math.max(-.18,Math.min(.36,pitch+(e.clientY-py)*.002));px=e.clientX;py=e.clientY});
 device.lost.then(e=>{status.textContent='GPU persa: '+e.message});
 let lastFps=performance.now(),count=0;
 function frame(time){
  resize();
  const ex=12.5*Math.sin(yaw),ez=12.5*Math.cos(yaw);
  const eye=[ex,3.45+pitch*6.,ez+1.4,0],target=[0,1.5,-4.7,0];
  data.set([w,h,time*.001,scale],0);data.set(eye,4);data.set(target,8);data.set([-.64,.62,.48,0],12);
  queue.writeBuffer(uniform,0,data);
  const encoder=device.createCommandEncoder();
  const pass=encoder.beginRenderPass({colorAttachments:[{view:context.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:.15,g:.24,b:.29,a:1}}]});
  pass.setPipeline(pipeline);pass.setBindGroup(0,bg);pass.draw(3);pass.end();queue.submit([encoder.finish()]);
  count++;if(time-lastFps>1300){status.textContent='WebGPU nativo · '+Math.round(count*1000/(time-lastFps))+' FPS · '+w+'×'+h;lastFps=time;count=0;}
  requestAnimationFrame(frame);
 }
 resize(true);status.textContent='Compilazione completata · primo fotogramma…';
 frame(performance.now());await queue.onSubmittedWorkDone();
 status.textContent='WebGPU · Scena generata';}
main().catch(e=>{console.error(e);document.getElementById('failure').style.display='block';document.getElementById('failure').textContent='Errore renderer: '+e.message;status.textContent='Impossibile avviare WebGPU'});
</script></body></html>
